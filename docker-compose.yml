version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - ./server:/app
    restart: unless-stopped
    networks:
      - tracker-network

networks:
  tracker-network:
    driver: bridge
