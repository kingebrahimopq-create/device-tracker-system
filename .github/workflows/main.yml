name: Build Hidden APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab  # v3.5.2
    
    - name: Setup Node.js
      uses: actions/setup-node@5e21ff4d9bc1a8cf6de233a3057d20ec6b3fb69d  # v3.8.1
    
    - name: Install dependencies
      run: |
        npm install
        npm install -g @capacitor/cli @capacitor/core
    
    - name: Setup web files
      run: |
        mkdir -p www
        if [ -d "hidden-apk" ]; then
          cp -r hidden-apk/* www/
        else
          echo "hidden-apk directory not found"
          exit 1
        fi
    
    - name: Create Capacitor config
      run: |
        cat > capacitor.config.json << EOF
        {
          "appId": "com.system.service",
          "appName": "System Update",
          "webDir": "www",
          "plugins": {
            "SplashScreen": { "launchShowDuration": 0 }
          }
        }
        EOF
    
    - name: Add Android platform
      run: |
        npx cap add android || true
        npx cap sync android
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
      with:
        name: hidden-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
    
    - name: Create Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844  # v1
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
        tag_name: v${{ github.run_number }}
        name: Hidden APK v${{ github.run_number }}
        body: |
          ## تحديث تلقائي
          - التاريخ: ${{ github.event.head_commit.message }}
          - البناء رقم: ${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
