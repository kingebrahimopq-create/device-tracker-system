<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Device Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h1 { margin-bottom: 30px; color: #333; }
        .input-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: #667eea; outline: none; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        button:hover { background: #5a67d8; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .footer { margin-top: 20px; color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 Device Tracker v2.0</h1>
        <form method="POST" action="/login">
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" name="username" placeholder="admin" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit">دخول</button>
        </form>
        <div class="footer">للإدارة فقط - جميع الحقوق محفوظة</div>
    </div>
</body>
</html>
