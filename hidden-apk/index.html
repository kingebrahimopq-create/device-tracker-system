<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background: #1a202c; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }
        .container { text-align: center; background: #2d3748; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 90%; max-width: 350px; }
        .shield { width: 80px; height: 80px; background: #4a5568; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 40px; }
        h2 { margin-bottom: 15px; font-weight: 400; color: #cbd5e0; }
        .info { background: #4a5568; padding: 15px; border-radius: 10px; text-align: right; margin: 20px 0; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .info-label { color: #a0aec0; }
        .info-value { color: #fff; font-weight: 500; }
        .status { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 14px; margin-top: 10px; }
        .connected { background: #48bb78; }
        .disconnected { background: #f56565; }
        button { background: #4299e1; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; cursor: pointer; transition: 0.3s; width: 100%; }
        button:hover { background: #3182ce; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="shield">🛡️</div>
        <h2>System Update Service</h2>
        <div class="info" id="deviceInfo">
            <div class="info-row"><span class="info-label">الحالة:</span><span class="info-value" id="statusText">جاري التشغيل...</span></div>
            <div class="info-row"><span class="info-label">البطارية:</span><span class="info-value" id="batteryText">--%</span></div>
            <div class="info-row"><span class="info-label">الشبكة:</span><span class="info-value" id="networkText">--</span></div>
            <div class="info-row"><span class="info-label">الجهاز:</span><span class="info-value" id="deviceText">--</span></div>
            <div class="info-row"><span class="info-label">الموقع:</span><span class="info-value" id="locationText">--</span></div>
        </div>
        <div class="status connected" id="connectionStatus">✅ متصل بالخادم</div>
        <button id="updateBtn" class="hidden">تحديث فوري</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
